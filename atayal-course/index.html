<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>泰雅語繪本 12 堂課詳細教學內容</title>
  <style>
    :root{--ink:#26302f;--muted:#66706d;--paper:#fffdf8;--panel:#f4f0e8;--line:#d8d0c2;--accent:#0f766e;--accent2:#b45309;--code:#eef6f4}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:var(--paper);font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;line-height:1.75}.layout{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}nav{position:sticky;top:0;height:100vh;overflow:auto;padding:28px 20px;background:var(--panel);border-right:1px solid var(--line)}nav h2{margin:0 0 14px;font-size:1.05rem;color:var(--accent)}nav a{display:block;padding:8px 10px;margin:3px 0;color:var(--ink);text-decoration:none;border-radius:6px;font-size:.94rem}nav a:hover{background:#e7ddd0}main{max-width:980px;width:100%;padding:36px 48px 72px}.cover{padding:28px 0 34px;border-bottom:3px solid var(--accent);margin-bottom:34px}.cover h1{margin:0 0 8px;font-size:2.1rem;line-height:1.25}.cover p{margin:0;color:var(--muted)}.lesson{padding:26px 0 36px;border-bottom:1px solid var(--line)}.lesson h1{margin:0 0 22px;padding-top:10px;color:var(--accent);font-size:1.9rem;line-height:1.3}h2{margin:30px 0 10px;padding-left:10px;border-left:5px solid var(--accent);font-size:1.25rem}h3{margin:24px 0 8px;color:var(--accent2);font-size:1.08rem}p{margin:7px 0}ol,ul{margin:8px 0 14px 1.35rem;padding-left:1rem}li{margin:4px 0}code{display:inline-block;padding:1px 6px;border-radius:5px;background:var(--code);color:#174642;font-family:Consolas,monospace;font-size:.95em}.toolbar{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--accent);background:var(--accent);color:white;border-radius:6px;padding:8px 12px;font-size:.95rem;cursor:pointer;text-decoration:none;display:inline-block}.btn.secondary{background:transparent;color:var(--accent)}.status{padding:16px;background:#fff7ed;border:1px solid #fed7aa;border-radius:8px}@media(max-width:900px){.layout{grid-template-columns:1fr}nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}main{padding:26px 22px 54px}}@media print{body{background:white;font-size:11pt}.layout{display:block}nav,.toolbar{display:none}main{max-width:none;padding:0}.cover{border-bottom:2px solid #000}.lesson{page-break-before:always;border-bottom:0}.lesson:first-of-type{page-break-before:auto}h1,h2,h3{page-break-after:avoid}code{border:1px solid #ccc;background:#f6f6f6}}
  </style>
</head>
<body>
  <div class="layout">
    <nav><h2>課程目錄</h2><div id="toc"></div></nav>
    <main>
      <header class="cover">
        <h1>泰雅語繪本 12 堂課詳細教學內容</h1>
        <p>此頁會讀取 GitHub 上的 Markdown 原稿呈現。同事可直接到 GitHub 編輯 lessons 裡的 Markdown 檔。</p>
        <div class="toolbar">
          <button class="btn" onclick="window.print()">列印 / 另存 PDF</button>
          <a class="btn secondary" href="https://github.com/Calumai/kutulutp2/tree/main/atayal-course/lessons">編輯 Markdown 原稿</a>
        </div>
      </header>
      <div id="content" class="status">課程內容載入中...</div>
    </main>
  </div>
<script>
const lessons = [
  ['lesson-01.md','第 1 堂：《山豬在做什麼》'],
  ['lesson-02.md','第 2 堂：《迷路的山羊》'],
  ['lesson-03.md','第 3 堂：《明天去野餐》'],
  ['lesson-04.md','第 4 堂：《大狗的嘴巴》'],
  ['lesson-05.md','第 5 堂：《誰偷了地瓜？》'],
  ['lesson-06.md','第 6 堂：《貪心的人》'],
  ['lesson-07.md','第 7 堂：《變成獨角仙》'],
  ['lesson-08.md','第 8 堂：《打擊出去》'],
  ['lesson-09.md','第 9 堂：《一起去刺魚》'],
  ['lesson-10.md','第 10 堂：《媽媽捕魚去》'],
  ['lesson-11.md','第 11 堂：《護士的摩托車》'],
  ['lesson-12.md','第 12 堂：《垃圾島》']
];
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function inline(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>')}
function md(md,id){let out=[],ul=false,ol=false;function close(){if(ul){out.push('</ul>');ul=false}if(ol){out.push('</ol>');ol=false}}md.split(/\r?\n/).forEach(line=>{line=line.trimEnd();if(!line){close();return}if(line.startsWith('# ')){close();out.push(`<h1 id="${id}">${inline(line.slice(2))}</h1>`)}else if(line.startsWith('## ')){close();out.push(`<h2>${inline(line.slice(3))}</h2>`)}else if(line.startsWith('### ')){close();out.push(`<h3>${inline(line.slice(4))}</h3>`)}else if(/^\d+\.\s+/.test(line)){if(ul){out.push('</ul>');ul=false}if(!ol){out.push('<ol>');ol=true}out.push(`<li>${inline(line.replace(/^\d+\.\s+/,''))}</li>`)}else if(line.startsWith('- ')){if(ol){out.push('</ol>');ol=false}if(!ul){out.push('<ul>');ul=true}out.push(`<li>${inline(line.slice(2))}</li>`)}else{close();out.push(`<p>${inline(line)}</p>`)}});close();return out.join('\n')}
async function load(){const toc=document.getElementById('toc'), content=document.getElementById('content');toc.innerHTML=lessons.map(([,t],i)=>`<a href="#lesson-${String(i+1).padStart(2,'0')}">${esc(t)}</a>`).join('');let html='';for(let i=0;i<lessons.length;i++){const [file,title]=lessons[i];const id=`lesson-${String(i+1).padStart(2,'0')}`;try{const r=await fetch(`lessons/${file}`);if(!r.ok) throw new Error(r.status);html+=`<section class="lesson">${md(await r.text(),id)}</section>`}catch(e){html+=`<section class="lesson"><h1 id="${id}">${esc(title)}</h1><p class="status">尚未上傳 ${file}，請稍後再試。</p></section>`}}content.className='';content.innerHTML=html}load();
</script>
</body>
</html>
